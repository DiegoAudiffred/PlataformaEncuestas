{% extends 'layout/layout.html' %}
{% load static %}

{% block body %}
<style>
    .survey-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .survey-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }

    .survey-img {
        transition: transform 0.5s ease;
    }

    .survey-card:hover .survey-img {
        transform: scale(1.05);
    }

    .survey-disabled {
        opacity: 0.7;
        filter: grayscale(80%);
        pointer-events: none;
    }

    @keyframes pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7);
        }

        70% {
            box-shadow: 0 0 0 8px rgba(25, 135, 84, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(25, 135, 84, 0);
        }
    }

    .status-pulse {
        animation: pulse 2s infinite;
    }
</style>

{% load static %}

<div class="container">

    <div class="fnBadComicRegularXL">
        Mis encuestas encuestas
    </div>

    {% include 'Index/misEncuestasFiltros.html' %}

    <div class="row" id="contenedorEncuestas">
        {% include 'Index/listaEncuestas.html' %}
    </div>

</div>

{% endblock %}
