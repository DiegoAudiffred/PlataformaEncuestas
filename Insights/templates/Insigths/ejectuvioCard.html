<div class="col-4">
    <div class="card border-tercero">
        <div class="card-title p-3 border-bottom border-primary fnBubbleSansRegularXL">
            {{p.username}} <span class="text-tercero">Total: {{ p.total_prospectos }}</span>
        </div>

        <div class="card-body shadow-lg">
            {% for r in registros %}

            {% if r.ejecutivoAsignado == p %}
            <a href="{% url 'Listado:verProspecto' r.id %}"
                class="btn rounded rounded-5 btn-septimo py-2 px-3 text-white shadow-lg text-decoration-none w-100 text-start my-2">
                {{r.nombreCompleto}}

            </a>
            {% endif %}
            {% endfor %}
        </div>


    </div>
</div>
