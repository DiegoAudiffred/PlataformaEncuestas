{% extends 'layout/layout.html' %}

{% load static %}

{% block body %}
<style>
    .upload-container {
        border: 2px dashed #0d6efd;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        background-color: #f8f9fa;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .upload-container:hover {
        background-color: #e9ecef;
        border-color: #0a58ca;
    }

    .upload-container.dragover {
        background-color: #cfe2ff;
        border-style: solid;
    }
</style>
<div class="container flex-grow-1">
    <div class="row">
        <div class="col-12 fnBubbleSansRegularXL border-bottom border-primary border-3 mb-3">
            Cargar datos
        </div>
        <div class="col-12 text-center mb-3" id="mensaje">

        </div>
        {% include 'CargaDeDatos/datosTabla.html' %}
    </div>
</div>
<div class="container-fluid">
    <div id="tablaCargada" style="max-height: 400px;">

    </div>

</div>






{% endblock %}
