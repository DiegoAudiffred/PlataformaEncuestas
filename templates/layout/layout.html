{% load static %}
<!doctype html>
<html lang="es">

<head>
    <title>Plataforma Prospectos UCG</title>
    <meta charset="utf-8">
    <link rel="manifest" href="{% static 'manifest.json' %}" type="application/manifest+json"
        crossorigin="use-credentials">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="{% static 'img/logo.png' %}">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 -->
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="shortcut icon" href="{% static 'img/logo.png' %}">

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="{% static 'masterSCSS/globalMaster.css' %}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

    {% block style %}
    <style>
        @media (max-width: 767.98px) {
            .no-grow-sm {
                flex: none !important;
            }

            .sidebar-sm-auto {
                min-height: auto !important;
            }
        }
    </style>
    {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 bg-white fnBadComicRegular">

    {% include 'layout/navbar.html' %}

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">



            <section class="col-12  mb-3  px-4">
                <main class="" id="main-content">
                    {% block body %}{% endblock %}
                </main>
            </section>

        </div>
    </div>

    <footer class="mt-auto">
        {% include 'layout/footer.html' %}
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="{% static 'bootstrap/js/bootstrap.js' %}"></script>



    {% block script %}{% endblock %}
</body>

</html>
